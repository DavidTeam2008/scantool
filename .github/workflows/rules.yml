name: rules

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    env:
      TEAM_RULES_TOKEN: ${{ secrets.TEAM_RULES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # 团队规则仓库；私有仓需配 TEAM_RULES_TOKEN（只读权限即可）。
      # token 缺失或无效时降级为 warning，避免阻塞 PR；配置正确后自动恢复校验。
      - name: Checkout team rules
        id: team
        if: env.TEAM_RULES_TOKEN != ''
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: davidtan2008/team-agent-template
          path: .team-rules
          token: ${{ secrets.TEAM_RULES_TOKEN }}

      - name: Team baseline in sync
        if: env.TEAM_RULES_TOKEN != '' && steps.team.outcome == 'success'
        run: python3 .team-rules/scripts/sync_team_baseline.py --check AGENTS.md

      - name: Team baseline skipped
        if: env.TEAM_RULES_TOKEN == '' || steps.team.outcome != 'success'
        run: echo "::warning::团队规则 checkout 失败（token 缺失/无效/无权限），跳过基线校验（见 docs/23 §2）"

      - name: Docs links and index
        run: python3 Tools/check-docs.py
