name: rules

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 团队规则仓已转 public，直接匿名浅克隆；若将来改回私有，改用 TEAM_RULES_TOKEN。
      - name: Checkout team rules
        run: git clone --depth 1 https://github.com/DavidTeam2008/team-agent-template.git .team-rules

      - name: Team baseline in sync
        run: python3 .team-rules/scripts/sync_team_baseline.py --check AGENTS.md

      - name: Docs links and index
        run: python3 Tools/check-docs.py
