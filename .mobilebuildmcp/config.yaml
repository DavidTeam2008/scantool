schemaVersion: 1

# 纸匣 Zhixia · MobileBuildMCP 项目配置
# 真机验收（spec/frame-truth/device-acceptance.md）依赖 device 工作流。
# 模拟器目录项（simulator-management、debugging、ui-automation）暂不开启，
# 需要时在 enabledWorkflows 里追加即可。
enabledWorkflows: ["simulator", "device", "project-discovery"]

# 项目 + scheme + 测试基线模拟器（AGENTS.md：make test 用 iPhone 17 Pro）
sessionDefaults:
  projectPath: "./Zhixia.xcodeproj"
  scheme: "Zhixia"
  simulatorName: "iPhone 17 Pro"
